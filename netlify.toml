[build]
  publish = "."
  command = "npm install && npm run build"
  functions = "netlify/functions"
  # Les véhicules (_vehicules/) sont lus en direct par la fonction vehicles.js
  # depuis GitHub — pas besoin de redéployer le site quand seul ce dossier
  # change (ex: prix/dispo/description modifiés ou véhicule supprimé via la
  # CMS). Les photos (images/) restent servies par Netlify (utilisées par le
  # CDN Images /.netlify/images pour le redimensionnement), donc un ajout de
  # photo redéploie toujours.
  ignore = 'if [ -z "$CACHED_COMMIT_REF" ] || [ "$CACHED_COMMIT_REF" = "$COMMIT_REF" ]; then exit 1; fi; git diff --quiet "$CACHED_COMMIT_REF" "$COMMIT_REF" -- . ":(exclude)_vehicules"'

[build.environment]
  NODE_VERSION = "18"

# Security headers for all pages
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
